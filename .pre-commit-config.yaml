repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: help-svg
        name: regenerate help.svg (local)
        entry: bash -c 'command -v shellplot >/dev/null 2>&1 || exit 0; shellplot svg single "uv run anno --help" --output help.svg --font-size 20'
        language: system
        files: ^(src/anno/.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: pytest-smoke
        name: pytest (CLI smoke)
        entry: uv run --with pytest --with-editable . pytest -q tests/test_smoke.py
        language: system
        pass_filenames: false
        always_run: true
