repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest (CLI smoke)
        entry: uv run --with pytest --with-editable . pytest -q tests/test_smoke.py
        language: system
        pass_filenames: false
        always_run: true
